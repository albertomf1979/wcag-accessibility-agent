name: Validate skill

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check axe-scan script syntax
        run: node --check skills/wcag-accessibility/scripts/axe-scan.mjs
      - name: Run local validations (no API key)
        run: python -m unittest discover -s tests -v
